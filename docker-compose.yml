# LogLens: web + api (Express) + ai (Python FastAPI)
# From labs/loglens:
#   docker compose up --build
# UI:  http://localhost:8088
# API: http://localhost:8091/api/health
# AI:  http://localhost:8092/health
#
# Optional: copy .env.example → .env

services:
  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    image: loglens-ai:0.1
    ports:
      - "8092:8092"
    environment:
      PORT: "8092"
      KNOWLEDGE_DIR: /app/knowledge/runbooks
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DIAGNOSE_MODE: ${DIAGNOSE_MODE:-auto}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: loglens-api:0.1
    ports:
      - "8091:8091"
    environment:
      PORT: "8091"
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      # Gateway calls the Python brain over the compose network
      AI_SERVICE_URL: http://ai:8092
      AI_SERVICE_REQUIRED: ${AI_SERVICE_REQUIRED:-false}
      # LLM key still useful if AI falls back to node-local, or for ai service via its own env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DIAGNOSE_MODE: ${DIAGNOSE_MODE:-auto}
    volumes:
      - loglens-data:/app/server/data
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8091/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: loglens-web:0.1
    ports:
      - "${WEB_PORT:-8088}:80"
    environment:
      PORT: "80"
      API_UPSTREAM: http://api:8091
    depends_on:
      api:
        condition: service_healthy
volumes:
  loglens-data:
