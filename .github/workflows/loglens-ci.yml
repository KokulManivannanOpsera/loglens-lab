# D4 — LogLens CI (fail closed on PR / push)
# This file lives in the loglens-lab repo root (.github/workflows/).

name: LogLens CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    working-directory: .

concurrency:
  group: loglens-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node — test · eval · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Unit + integration tests
        run: npm test
        env:
          EMBEDDING_PROVIDER: local
          RAG_MODE: hybrid
          AI_SERVICE_URL: ""

      - name: A3 golden evals
        run: npm run eval
        env:
          EMBEDDING_PROVIDER: local
          RAG_MODE: hybrid
          AI_SERVICE_URL: ""

      - name: Build server + client
        run: npm run build

  node-postgres:
    name: Node — postgres history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loglens
          POSTGRES_PASSWORD: loglens
          POSTGRES_DB: loglens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loglens -d loglens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: History tests against Postgres
        working-directory: server
        run: node --import tsx --test tests/history-pg.test.ts
        env:
          DATABASE_URL: postgres://loglens:loglens@localhost:5432/loglens

  python-ai:
    name: Python AI — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install + test
        working-directory: ai
        run: |
          python -m pip install -q -r requirements.txt
          pytest -q
        env:
          EMBEDDING_PROVIDER: local
          RAG_MODE: hybrid
          RAG_VECTORS_PATH: ${{ runner.temp }}/rag-vectors.json
